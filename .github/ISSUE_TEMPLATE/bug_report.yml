name: Bug report
description: Report a connector, schema or setup problem
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include API and operation IDs. Remove credentials and personal data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use redacted inputs and error messages.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node version and MCP client
